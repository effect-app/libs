packages:
  - packages/*
allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  dprint: false
  esbuild: false
  msgpackr-extract: false
  vue-demi: false
minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.47.2"
  - "@effect/tsgo-darwin-x64@0.47.2"
  - "@effect/tsgo-linux-arm64@0.47.2"
  - "@effect/tsgo-linux-arm@0.47.2"
  - "@effect/tsgo-linux-x64@0.47.2"
  - "@effect/tsgo-win32-arm64@0.47.2"
  - "@effect/tsgo-win32-x64@0.47.2"
  - "@effect/tsgo@0.47.2"
  - "@effect/language-service@0.87.3"
  - "@effect/atom-vue@4.0.0"
  - "@effect/platform-browser@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - "@effect/sql-sqlite-node@4.0.0"
  - "@effect/vitest@4.0.0"
  - effect@4.0.0
overrides:
  date-fns: ^4.4.0
  fast-check: ^4.9.0
  vue: ^3.5.35
patchedDependencies:
  ts-plugin-sort-import-suggestions: patches/ts-plugin-sort-import-suggestions.patch
  "@tanstack/query-core": patches/@tanstack__query-core.patch
  typescript@6.0.3: patches/typescript.patch
  "@sendgrid/mail": patches/@sendgrid__mail.patch
  "@changesets/cli@2.31.0": patches/@changesets__cli@2.31.0.patch
